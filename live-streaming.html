<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="KIUMA Live - Watch live Islamic lectures and events">
    <title>Live - KIUMA</title>
    <link rel="icon" href="logo.png" type="image/png">
    <script>
        (function() {
            var t;
            try { t = localStorage.getItem('themePreference'); } catch(e) {}
            // Force dark for streaming page
            document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ========== FULL-VIEWPORT STAGE ========== */
        .stage {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #videoPlayer {
            width: 100%; height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        /* ========== OVERLAY LAYER (controls on top of video) ========== */
        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.35s ease;
        }
        .overlay.hidden { opacity: 0; }
        .overlay.hidden .top-bar,
        .overlay.hidden .bottom-bar,
        .overlay.hidden .side-controls { pointer-events: none; }

        /* allow clicks to pass through to toggle area */
        .overlay > * { pointer-events: auto; }

        /* Tap zone to toggle controls */
        .tap-zone {
            position: fixed;
            inset: 0;
            z-index: 9;
            cursor: pointer;
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + var(--safe-top)) 16px 12px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
            z-index: 12;
        }

        .back-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.22); }

        .top-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #e53935;
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(229,57,53,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .live-pill.visible { opacity: 1; }
        .live-pill .dot {
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: pulse-dot 1.4s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .viewer-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .viewer-count.visible { opacity: 1; }
        .viewer-count i { font-size: 10px; }

        .network-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .network-pill.good { border-color: rgba(76,175,80,0.4); color: #81C784; }
        .network-pill.medium { border-color: rgba(255,152,0,0.4); color: #FFB74D; }
        .network-pill.poor { border-color: rgba(244,67,54,0.4); color: #E57373; }

        /* ========== BOTTOM BAR ========== */
        .bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 60px 16px calc(16px + var(--safe-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 50%, transparent 100%);
            z-index: 12;
        }

        /* Stream info — bottom left */
        .stream-info {
            flex: 1;
            min-width: 0;
            padding-right: 16px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.3s, transform 0.3s;
        }
        .stream-info.visible { opacity: 1; transform: translateY(0); }

        .stream-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .stream-meta-text {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stream-meta-text i { font-size: 10px; color: rgba(255,255,255,0.4); }

        /* ========== SIDE CONTROLS — right edge ========== */
        .side-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.10);
            color: #fff;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.08); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.active { background: rgba(255,255,255,0.25); color: #4CAF50; border-color: rgba(76,175,80,0.3); }
        .ctrl-btn.muted { color: #E57373; border-color: rgba(229,57,53,0.3); }

        .ctrl-label {
            font-size: 9px;
            font-weight: 600;
            margin-top: 3px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            letter-spacing: 0.3px;
        }

        .ctrl-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========== QUALITY SHEET ========== */
        .quality-sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .quality-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

        .quality-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            padding: 16px 16px calc(20px + var(--safe-bottom));
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            max-width: 500px;
            margin: 0 auto;
        }
        .quality-sheet-backdrop.open .quality-sheet { transform: translateY(0); }

        .sheet-handle {
            width: 36px; height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 16px;
        }
        .sheet-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            color: rgba(255,255,255,0.9);
        }

        .quality-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }
        .quality-option:hover { background: rgba(255,255,255,0.06); }
        .quality-option.selected { background: rgba(76,175,80,0.12); }

        .quality-option .q-label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
        }
        .quality-option .q-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-top: 2px;
        }
        .quality-option .q-check {
            color: #4CAF50;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .quality-option.selected .q-check { opacity: 1; }

        /* ========== STREAM PICKER (when no stream is playing) ========== */
        .stream-picker {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000;
            display: flex;
            flex-direction: column;
            transition: opacity 0.35s, transform 0.35s;
        }
        .stream-picker.hiding {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .picker-header {
            padding: calc(16px + var(--safe-top)) 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .picker-header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .picker-header h1 i { color: #e53935; margin-right: 8px; font-size: 18px; }

        .picker-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .picker-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70%;
            text-align: center;
            color: rgba(255,255,255,0.35);
        }
        .picker-empty i { font-size: 56px; margin-bottom: 18px; opacity: 0.4; }
        .picker-empty h3 { font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        .picker-empty p { font-size: 13px; max-width: 260px; line-height: 1.5; }

        .picker-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60%;
            color: rgba(255,255,255,0.4);
            gap: 14px;
        }
        .picker-loading i { font-size: 32px; }

        .stream-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .stream-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }
        .stream-item:active { transform: scale(0.98); }

        .stream-thumb {
            width: 72px; height: 72px;
            border-radius: 14px;
            background: linear-gradient(135deg, #e53935, #ff5722);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .stream-thumb i { font-size: 26px; color: rgba(255,255,255,0.9); z-index: 1; }
        .stream-thumb img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .stream-thumb .thumb-live {
            position: absolute;
            bottom: 4px; left: 50%;
            transform: translateX(-50%);
            background: #e53935;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.8px;
        }

        .stream-detail { flex: 1; min-width: 0; }
        .stream-detail h3 {
            font-size: 14px; font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255,255,255,0.95);
        }
        .stream-detail .s-meta {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stream-detail .s-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .stream-detail .s-meta i { font-size: 9px; }

        .stream-play-icon {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(76,175,80,0.15);
            border: 1px solid rgba(76,175,80,0.25);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: #4CAF50;
            font-size: 16px;
            transition: all 0.2s;
        }
        .stream-item:hover .stream-play-icon {
            background: rgba(76,175,80,0.25);
            transform: scale(1.08);
        }

        /* ========== CONNECTION STATE OVERLAY ========== */
        .connection-state {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .connection-state.visible { opacity: 1; }

        .conn-spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .conn-text {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            text-align: center;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
        }

        /* ========== STATUS TOAST ========== */
        .toast {
            position: fixed;
            top: calc(70px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(30,30,30,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 20px;
            border-radius: 28px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90vw;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i { font-size: 14px; }
        .toast.success i { color: #4CAF50; }
        .toast.error i { color: #E57373; }
        .toast.info i { color: #64B5F6; }

        /* ========== DOUBLE-TAP ANIMATION ========== */
        .seek-indicator {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 25;
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            font-weight: 600;
        }
        .seek-indicator.left { left: 30px; }
        .seek-indicator.right { right: 30px; }
        .seek-indicator.visible { opacity: 1; }
        .seek-indicator i { font-size: 28px; }

        /* ========== LANDSCAPE TWEAKS ========== */
        @media (orientation: landscape) {
            .side-controls { gap: 14px; }
            .ctrl-btn { width: 40px; height: 40px; font-size: 16px; }
            .ctrl-label { font-size: 8px; }
            .stream-title { font-size: 14px; }
            .top-bar { padding-top: calc(8px + var(--safe-top)); padding-bottom: 8px; }
            .bottom-bar { padding-top: 40px; padding-bottom: calc(10px + var(--safe-bottom)); }
        }

        /* ========== DESKTOP (wider screens) ========== */
        @media (min-width: 768px) {
            .ctrl-btn { width: 50px; height: 50px; font-size: 20px; }
            .stream-title { font-size: 17px; }
            .side-controls { gap: 22px; }
        }

        /* Scrollbar for picker */
        .picker-body::-webkit-scrollbar { width: 4px; }
        .picker-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    </style>
</head>
<body>

    <!-- ===== STAGE: Full-viewport video ===== -->
    <div class="stage">
        <video id="videoPlayer" playsinline autoplay></video>
    </div>

    <!-- ===== TAP ZONE: toggle controls visibility ===== -->
    <div class="tap-zone" id="tapZone"></div>

    <!-- ===== CONNECTION STATE ===== -->
    <div class="connection-state" id="connState">
        <div class="conn-spinner"></div>
        <div class="conn-text" id="connText">Connecting...</div>
    </div>

    <!-- ===== OVERLAY: controls on top of video ===== -->
    <div class="overlay" id="overlay">

        <!-- Top bar -->
        <div class="top-bar">
            <a href="index.html" class="back-btn" id="backBtn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="top-info">
                <div class="live-pill" id="livePill">
                    <span class="dot"></span>
                    LIVE
                </div>
                <div class="viewer-count" id="viewerCount">
                    <i class="fas fa-eye"></i>
                    <span id="viewerNum">0</span>
                </div>
                <div class="network-pill" id="networkPill">
                    <i class="fas fa-wifi"></i>
                    <span id="networkText">--</span>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <!-- Left: stream info -->
            <div class="stream-info" id="streamInfo">
                <div class="stream-title" id="streamTitle">Select a stream</div>
                <div class="stream-meta-text" id="streamMeta">
                    <span><i class="fas fa-broadcast-tower"></i> KIUMA Live</span>
                </div>
            </div>

            <!-- Right: controls -->
            <div class="side-controls">
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnMute" title="Mute / Unmute">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <span class="ctrl-label">Sound</span>
                </div>
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnQuality" title="Quality">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                    <span class="ctrl-label">Quality</span>
                </div>
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnPip" title="Picture in Picture">
                        <i class="fas fa-clone"></i>
                    </button>
                    <span class="ctrl-label">PiP</span>
                </div>
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnFullscreen" title="Fullscreen">
                        <i class="fas fa-expand"></i>
                    </button>
                    <span class="ctrl-label">Full</span>
                </div>
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnShare" title="Share">
                        <i class="fas fa-share"></i>
                    </button>
                    <span class="ctrl-label">Share</span>
                </div>
                <div class="ctrl-group">
                    <button class="ctrl-btn" id="btnStreams" title="Browse Streams">
                        <i class="fas fa-list"></i>
                    </button>
                    <span class="ctrl-label">Streams</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== QUALITY SHEET ===== -->
    <div class="quality-sheet-backdrop" id="qualityBackdrop">
        <div class="quality-sheet" id="qualitySheet">
            <div class="sheet-handle"></div>
            <div class="sheet-title">Video Quality</div>
            <div id="qualityOptions">
                <div class="quality-option selected" data-quality="auto">
                    <div>
                        <div class="q-label">Auto</div>
                        <div class="q-desc">Recommended - adjusts to your connection</div>
                    </div>
                    <i class="fas fa-check q-check"></i>
                </div>
                <div class="quality-option" data-quality="1080">
                    <div>
                        <div class="q-label">1080p</div>
                        <div class="q-desc">Full HD</div>
                    </div>
                    <i class="fas fa-check q-check"></i>
                </div>
                <div class="quality-option" data-quality="720">
                    <div>
                        <div class="q-label">720p</div>
                        <div class="q-desc">HD</div>
                    </div>
                    <i class="fas fa-check q-check"></i>
                </div>
                <div class="quality-option" data-quality="480">
                    <div>
                        <div class="q-label">480p</div>
                        <div class="q-desc">Standard</div>
                    </div>
                    <i class="fas fa-check q-check"></i>
                </div>
                <div class="quality-option" data-quality="360">
                    <div>
                        <div class="q-label">360p</div>
                        <div class="q-desc">Low data</div>
                    </div>
                    <i class="fas fa-check q-check"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== STREAM PICKER ===== -->
    <div class="stream-picker" id="streamPicker">
        <div class="picker-header">
            <h1><i class="fas fa-circle"></i> Live Now</h1>
            <button class="back-btn" id="pickerCloseBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="picker-body" id="pickerBody">
            <div class="picker-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Finding live streams...</span>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastText">Message</span>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- HLS.js for future HLS support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
    // ============================================================
    //  KIUMA Live — Immersive Stream Viewer
    // ============================================================
    (() => {
        'use strict';

        // ---- DOM refs ----
        const $ = (sel) => document.querySelector(sel);
        const video        = $('#videoPlayer');
        const overlay      = $('#overlay');
        const tapZone      = $('#tapZone');
        const connState    = $('#connState');
        const connText     = $('#connText');
        const livePill     = $('#livePill');
        const viewerCount  = $('#viewerCount');
        const viewerNum    = $('#viewerNum');
        const networkPill  = $('#networkPill');
        const networkText  = $('#networkText');
        const streamInfo   = $('#streamInfo');
        const streamTitle  = $('#streamTitle');
        const streamMeta   = $('#streamMeta');
        const btnMute      = $('#btnMute');
        const btnQuality   = $('#btnQuality');
        const btnPip       = $('#btnPip');
        const btnFullscreen = $('#btnFullscreen');
        const btnShare     = $('#btnShare');
        const btnStreams    = $('#btnStreams');
        const qualityBackdrop = $('#qualityBackdrop');
        const streamPicker = $('#streamPicker');
        const pickerBody   = $('#pickerBody');
        const pickerCloseBtn = $('#pickerCloseBtn');
        const toast        = $('#toast');
        const toastText    = $('#toastText');

        // ---- State ----
        let currentPC       = null;
        let currentStreamId = null;
        let currentViewerId = null;
        let currentQuality  = 'auto';
        let hls             = null;
        let controlsVisible = true;
        let hideTimer       = null;
        let retryCount      = 0;
        const MAX_RETRIES   = 10;
        let offerUnsubscribe = null;
        let viewerDocUnsubscribe = null;
        let reconnectTimer   = null;
        let viewerInterval   = null;
        let networkSpeed     = 0;
        let toastTimer       = null;
        let isStreamActive   = false;
        let wakeLock         = null;
        let signalingInProgress = false;
        let stallCheckInterval = null;
        let lastVideoTime    = 0;
        let stallCount       = 0;

        // ICE servers — STUN + TURN (can be overridden from Firestore)
        const ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'turn:a.relay.metered.ca:80', username: 'e8dd65b92a0fbc3e0f28a930', credential: '5l3TpsinAr7VECvk' },
            { urls: 'turn:a.relay.metered.ca:80?transport=tcp', username: 'e8dd65b92a0fbc3e0f28a930', credential: '5l3TpsinAr7VECvk' },
            { urls: 'turn:a.relay.metered.ca:443', username: 'e8dd65b92a0fbc3e0f28a930', credential: '5l3TpsinAr7VECvk' },
            { urls: 'turns:a.relay.metered.ca:443?transport=tcp', username: 'e8dd65b92a0fbc3e0f28a930', credential: '5l3TpsinAr7VECvk' }
        ];

        // Generate a persistent viewer ID for this session
        const VIEWER_ID = 'v_' + Math.random().toString(36).substr(2, 12) + '_' + Date.now().toString(36);

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            setupControls();
            setupTapToggle();
            setupNetworkMonitor();
            setupLifecycle();
            loadTURNConfig();
            loadStreams();

            // If HLS.js is available, prep it
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxBufferHole: 0.5
                });
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                    }
                });
            }
        }

        // ============================================================
        //  CONTROLS
        // ============================================================
        function setupControls() {
            // Mute
            btnMute.addEventListener('click', (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                updateMuteUI();
                showToast(video.muted ? 'Muted' : 'Unmuted', 'info');
            });

            // Quality
            btnQuality.addEventListener('click', (e) => {
                e.stopPropagation();
                openQualitySheet();
            });
            qualityBackdrop.addEventListener('click', (e) => {
                if (e.target === qualityBackdrop) closeQualitySheet();
            });
            document.querySelectorAll('.quality-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    setQuality(opt.dataset.quality);
                    closeQualitySheet();
                });
            });

            // PiP
            btnPip.addEventListener('click', async (e) => {
                e.stopPropagation();
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                        showToast('Exited Picture-in-Picture', 'info');
                    } else if (video.requestPictureInPicture) {
                        await video.requestPictureInPicture();
                        showToast('Picture-in-Picture', 'success');
                    } else {
                        showToast('PiP not supported', 'error');
                    }
                } catch (err) {
                    showToast('PiP unavailable', 'error');
                }
            });

            // Fullscreen
            btnFullscreen.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFullscreen();
            });

            // Share
            btnShare.addEventListener('click', (e) => {
                e.stopPropagation();
                shareStream();
            });

            // Browse streams
            btnStreams.addEventListener('click', (e) => {
                e.stopPropagation();
                showPicker();
            });

            // Picker close button — go back to stream if active, otherwise go home
            pickerCloseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isStreamActive) {
                    hidePicker();
                } else {
                    window.location.href = 'index.html';
                }
            });

            // Video events
            video.addEventListener('play', () => updateMuteUI());
            video.addEventListener('volumechange', () => updateMuteUI());
        }

        function updateMuteUI() {
            const icon = btnMute.querySelector('i');
            if (video.muted) {
                icon.className = 'fas fa-volume-mute';
                btnMute.classList.add('muted');
            } else {
                icon.className = 'fas fa-volume-up';
                btnMute.classList.remove('muted');
            }
        }

        // ============================================================
        //  TAP-TO-TOGGLE CONTROLS
        // ============================================================
        function setupTapToggle() {
            let tapTimeout = null;

            tapZone.addEventListener('click', () => {
                if (tapTimeout) { clearTimeout(tapTimeout); tapTimeout = null; return; }
                tapTimeout = setTimeout(() => {
                    tapTimeout = null;
                    toggleControls();
                }, 220);
            });

            // Auto-hide after 4s when stream is playing
            startAutoHide();
        }

        function toggleControls() {
            controlsVisible = !controlsVisible;
            overlay.classList.toggle('hidden', !controlsVisible);
            if (controlsVisible) startAutoHide();
        }

        function showControls() {
            controlsVisible = true;
            overlay.classList.remove('hidden');
            startAutoHide();
        }

        function startAutoHide() {
            clearTimeout(hideTimer);
            if (isStreamActive) {
                hideTimer = setTimeout(() => {
                    controlsVisible = false;
                    overlay.classList.add('hidden');
                }, 4000);
            }
        }

        // ============================================================
        //  QUALITY
        // ============================================================
        function openQualitySheet() {
            qualityBackdrop.classList.add('open');
        }
        function closeQualitySheet() {
            qualityBackdrop.classList.remove('open');
        }

        function setQuality(quality) {
            currentQuality = quality;
            document.querySelectorAll('.quality-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.quality === quality);
            });
            if (hls && hls.media) {
                if (quality === 'auto') {
                    hls.currentLevel = -1;
                } else {
                    const lvl = hls.levels.findIndex(l => l.height === parseInt(quality));
                    if (lvl !== -1) hls.currentLevel = lvl;
                }
            }
            showToast(`Quality: ${quality === 'auto' ? 'Auto' : quality + 'p'}`, 'info');
        }

        // ============================================================
        //  FULLSCREEN
        // ============================================================
        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
        }

        // ============================================================
        //  SHARE
        // ============================================================
        function shareStream() {
            const title = streamTitle.textContent || 'KIUMA Live';
            if (navigator.share) {
                navigator.share({ title, text: `Watch "${title}" live on KIUMA`, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast('Link copied!', 'success');
                });
            }
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            clearTimeout(toastTimer);
            const icon = toast.querySelector('i');
            icon.className = 'fas ' + (type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
            toast.className = 'toast ' + type;
            toastText.textContent = msg;
            requestAnimationFrame(() => toast.classList.add('show'));
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ============================================================
        //  CONNECTION STATE INDICATOR
        // ============================================================
        function showConnecting(msg = 'Connecting...') {
            connText.textContent = msg;
            connState.classList.add('visible');
        }
        function hideConnecting() {
            connState.classList.remove('visible');
        }

        // ============================================================
        //  NETWORK MONITOR
        // ============================================================
        function setupNetworkMonitor() {
            measureNetwork();
            setInterval(measureNetwork, 12000);
            navigator.connection?.addEventListener('change', measureNetwork);
        }

        function measureNetwork() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn && conn.downlink) {
                networkSpeed = conn.downlink;
            }
            updateNetworkUI();
        }

        function updateNetworkUI() {
            const s = networkSpeed;
            networkPill.className = 'network-pill';
            if (s > 5) {
                networkPill.classList.add('good');
                networkText.textContent = s.toFixed(0) + ' Mbps';
            } else if (s > 1) {
                networkPill.classList.add('medium');
                networkText.textContent = s.toFixed(1) + ' Mbps';
            } else if (s > 0) {
                networkPill.classList.add('poor');
                networkText.textContent = s.toFixed(1) + ' Mbps';
            } else {
                networkText.textContent = '--';
            }
        }

        // ============================================================
        //  STREAM PICKER
        // ============================================================
        function showPicker() {
            streamPicker.classList.remove('hiding');
            streamPicker.style.display = 'flex';
            loadStreams();
        }
        function hidePicker() {
            streamPicker.classList.add('hiding');
            setTimeout(() => {
                if (streamPicker.classList.contains('hiding')) {
                    streamPicker.style.display = 'none';
                }
            }, 350);
        }

        async function loadStreams() {
            pickerBody.innerHTML = `<div class="picker-loading"><i class="fas fa-spinner fa-spin"></i><span>Finding live streams...</span></div>`;

            // Wait for Firebase
            let attempts = 0;
            while (!window.firebaseDb && attempts < 20) {
                await new Promise(r => setTimeout(r, 300));
                attempts++;
            }

            if (!window.firebaseDb) {
                pickerBody.innerHTML = `<div class="picker-empty"><i class="fas fa-wifi-slash"></i><h3>Connection issue</h3><p>Could not connect to the server. Pull down to retry.</p></div>`;
                return;
            }

            try {
                const snapshot = await window.firebaseDb
                    .collection('liveStreams')
                    .where('status', '==', 'live')
                    .limit(20)
                    .get();

                const streams = [];
                snapshot.forEach(doc => streams.push({ id: doc.id, ...doc.data() }));

                if (streams.length === 0) {
                    pickerBody.innerHTML = `
                        <div class="picker-empty">
                            <i class="fas fa-satellite-dish"></i>
                            <h3>No live streams</h3>
                            <p>There are no live streams at the moment. Check back later.</p>
                        </div>`;
                    return;
                }

                pickerBody.innerHTML = streams.map(s => `
                    <div class="stream-item" data-id="${s.id}">
                        <div class="stream-thumb">
                            ${s.thumbnail ? `<img src="${s.thumbnail}" alt="">` : '<i class="fas fa-broadcast-tower"></i>'}
                            <span class="thumb-live">LIVE</span>
                        </div>
                        <div class="stream-detail">
                            <h3>${escHtml(s.title || 'Live Stream')}</h3>
                            <div class="s-meta">
                                <span><i class="fas fa-eye"></i> ${s.viewerCount || 0}</span>
                                <span><i class="fas fa-clock"></i> ${timeAgo(s.startedAt)}</span>
                                ${s.category ? `<span><i class="fas fa-tag"></i> ${escHtml(s.category)}</span>` : ''}
                            </div>
                        </div>
                        <div class="stream-play-icon"><i class="fas fa-play"></i></div>
                    </div>
                `).join('');

                // Bind clicks
                pickerBody.querySelectorAll('.stream-item').forEach(el => {
                    el.addEventListener('click', () => watchStream(el.dataset.id));
                });

            } catch (err) {
                console.error('Error loading streams:', err);
                pickerBody.innerHTML = `<div class="picker-empty"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>Could not load streams. Tap to retry.</p></div>`;
                pickerBody.querySelector('.picker-empty').addEventListener('click', loadStreams);
            }
        }

        // ============================================================
        //  WATCH STREAM — main entry point
        // ============================================================
        async function watchStream(streamId) {
            console.log('[LIVE] watchStream:', streamId);
            currentStreamId = streamId;
            retryCount = 0;

            // Cleanup
            cleanup();

            // Hide picker, show connecting
            hidePicker();
            showConnecting('Connecting to stream...');
            showControls();

            try {
                await connectWebRTC(streamId);
            } catch (err) {
                console.error('[LIVE] Connection failed:', err);
                showToast('Connection failed: ' + err.message, 'error');
                scheduleReconnect(streamId);
            }
        }

        function cleanup() {
            if (currentPC) { try { currentPC.close(); } catch(e) {} currentPC = null; }
            if (offerUnsubscribe) { offerUnsubscribe(); offerUnsubscribe = null; }
            if (viewerDocUnsubscribe) { viewerDocUnsubscribe(); viewerDocUnsubscribe = null; }
            if (viewerInterval) { clearInterval(viewerInterval); viewerInterval = null; }
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            stopStallDetection();
            video.srcObject = null;
            isStreamActive = false;
            releaseWakeLock();

            // Remove viewer doc from Firestore (non-blocking)
            if (currentStreamId && currentViewerId) {
                try {
                    window.firebaseDb.collection('liveStreams').doc(currentStreamId)
                        .collection('viewers').doc(currentViewerId).delete().catch(() => {});
                    window.firebaseDb.collection('liveStreams').doc(currentStreamId).update({
                        viewerCount: firebase.firestore.FieldValue.increment(-1)
                    }).catch(() => {});
                } catch(e) {}
            }
        }

        // ============================================================
        //  WebRTC CONNECTION (multi-viewer via subcollection)
        //
        //  Flow:
        //  1. Viewer creates doc in liveStreams/{id}/viewers/{viewerId}
        //  2. Admin detects new viewer, creates PeerConnection, writes sdpOffer to viewer doc
        //  3. Viewer reads sdpOffer, creates answer, writes sdpAnswer back
        //  4. Admin reads answer, connection established
        //  This allows unlimited simultaneous viewers.
        // ============================================================
        async function connectWebRTC(streamId) {
            // 1. Get stream doc — verify it's live
            const streamDoc = await window.firebaseDb.collection('liveStreams').doc(streamId).get();
            const streamData = streamDoc.data();

            if (!streamData) throw new Error('Stream not found');
            if (streamData.status === 'ended') throw new Error('Stream has ended');

            // Show stream info
            setStreamInfo(streamData);

            // 2. Clean stale viewer doc (from previous attempt) then register fresh
            currentViewerId = VIEWER_ID;
            const viewerRef = window.firebaseDb.collection('liveStreams').doc(streamId)
                .collection('viewers').doc(VIEWER_ID);

            // Delete old doc first to clear stale sdpOffer/sdpAnswer from previous connection
            try { await viewerRef.delete(); } catch(e) {}

            await viewerRef.set({
                status: 'joining',
                joinedAt: new Date().toISOString(),
                userAgent: navigator.userAgent.substring(0, 120)
            });
            console.log('[LIVE] Viewer registered:', VIEWER_ID);

            // Increment viewer count
            if (retryCount === 0) {
                try {
                    await window.firebaseDb.collection('liveStreams').doc(streamId).update({
                        viewerCount: firebase.firestore.FieldValue.increment(1)
                    });
                } catch(e) {}
            }

            // 3. Listen on our viewer doc for the admin's sdpOffer
            showConnecting('Waiting for broadcaster...');

            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => {
                    // Fallback: try legacy single-offer mode (backward compat)
                    console.log('[LIVE] Timeout waiting for per-viewer offer, trying legacy mode...');
                    if (viewerDocUnsubscribe) { viewerDocUnsubscribe(); viewerDocUnsubscribe = null; }
                    connectWebRTCLegacy(streamId, streamData).then(resolve).catch(reject);
                }, 8000);

                viewerDocUnsubscribe = viewerRef.onSnapshot(async (doc) => {
                    const vd = doc.data();
                    if (!vd || !vd.sdpOffer) return; // Still waiting
                    if (signalingInProgress) return; // Prevent duplicate calls
                    signalingInProgress = true;

                    clearTimeout(timeout);
                    console.log('[LIVE] Got per-viewer SDP offer from admin');

                    try {
                        await setupPeerConnection(streamId, vd.sdpOffer, viewerRef);
                        resolve();
                    } catch (err) {
                        reject(err);
                    } finally {
                        signalingInProgress = false;
                    }
                });
            });

            // 4. Listen for stream-level changes (end, viewer count)
            setupStreamListener(streamId);

            // 5. Start viewer count polling
            startViewerPolling(streamId);

            // Acquire wake lock
            acquireWakeLock();
        }

        // Legacy mode: works with the old single-offer/single-answer on the parent doc
        // This ensures backward compatibility if admin hasn't been updated yet
        async function connectWebRTCLegacy(streamId, streamData) {
            if (!streamData.sdpOffer) throw new Error('Stream not ready (no offer)');
            console.log('[LIVE] Using legacy single-offer mode');

            const viewerRef = window.firebaseDb.collection('liveStreams').doc(streamId);
            await setupPeerConnection(streamId, streamData.sdpOffer, viewerRef, true);
            setupStreamListener(streamId);
            startViewerPolling(streamId);
            acquireWakeLock();
        }

        // Load custom TURN config from Firestore (overrides defaults)
        async function loadTURNConfig() {
            try {
                let attempts = 0;
                while (!window.firebaseDb && attempts < 15) {
                    await new Promise(r => setTimeout(r, 300));
                    attempts++;
                }
                if (!window.firebaseDb) return;
                const doc = await window.firebaseDb.collection('config').doc('turnServers').get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.servers && Array.isArray(data.servers)) {
                        const stunOnly = ICE_SERVERS.filter(s => typeof s.urls === 'string' && s.urls.startsWith('stun:'));
                        ICE_SERVERS.length = 0;
                        ICE_SERVERS.push(...stunOnly, ...data.servers);
                        console.log('[LIVE] Loaded custom TURN config');
                    }
                }
            } catch(e) { console.log('[LIVE] No custom TURN config, using defaults'); }
        }

        // Shared PeerConnection setup — used by both multi-viewer and legacy paths
        async function setupPeerConnection(streamId, sdpOffer, answerRef, isLegacy = false) {
            const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
            currentPC = pc;

            // Handle incoming tracks
            pc.ontrack = (event) => {
                console.log('[LIVE] Track received:', event.track.kind);
                if (event.streams && event.streams[0]) {
                    video.srcObject = event.streams[0];
                } else {
                    let ms = video.srcObject;
                    if (!ms || !(ms instanceof MediaStream)) {
                        ms = new MediaStream();
                        video.srcObject = ms;
                    }
                    ms.addTrack(event.track);
                }
                video.play().catch(() => {});
                retryCount = 0;
                isStreamActive = true;
                hideConnecting();
                showToast('You are watching live', 'success');
                startAutoHide();
            };

            // ICE state changes
            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                console.log('[LIVE] ICE state:', state);
                switch (state) {
                    case 'connected':
                    case 'completed':
                        retryCount = 0;
                        hideConnecting();
                        isStreamActive = true;
                        livePill.classList.add('visible');
                        viewerCount.classList.add('visible');
                        streamInfo.classList.add('visible');
                        startStallDetection();
                        break;
                    case 'disconnected':
                        showConnecting('Reconnecting...');
                        showToast('Connection interrupted', 'error');
                        // Wait 8s — broadcaster may initiate ICE restart in that window
                        setTimeout(() => {
                            if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                                scheduleReconnect(streamId);
                            }
                        }, 8000);
                        break;
                    case 'failed':
                        scheduleReconnect(streamId);
                        break;
                    case 'closed':
                        hideConnecting();
                        break;
                }
            };

            // Set remote offer
            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: sdpOffer }));

            // Create & set answer
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            // Wait for ICE gathering
            const fullAnswer = await new Promise((resolve) => {
                const timeout = setTimeout(() => resolve(pc.localDescription), 5000);
                if (pc.iceGatheringState === 'complete') { clearTimeout(timeout); resolve(pc.localDescription); return; }
                pc.onicegatheringstatechange = () => {
                    if (pc.iceGatheringState === 'complete') { clearTimeout(timeout); resolve(pc.localDescription); }
                };
            });

            // Save answer — either to viewer subcollection doc or legacy parent doc
            if (isLegacy) {
                await answerRef.update({ sdpAnswer: fullAnswer.sdp });
            } else {
                await answerRef.update({ sdpAnswer: fullAnswer.sdp, status: 'connected' });
            }
            console.log('[LIVE] Answer saved to Firestore');

            showConnecting('Waiting for stream...');

            // Keep listening for ICE restart offers from broadcaster
            if (!isLegacy) {
                setupIceRestartListener(pc, answerRef);
            }
        }

        // Listen for broadcaster-initiated ICE restarts on the viewer doc
        function setupIceRestartListener(pc, viewerRef) {
            // Re-use viewerDocUnsubscribe — replace previous listener
            if (viewerDocUnsubscribe) viewerDocUnsubscribe();
            let lastOfferSdp = null;
            viewerDocUnsubscribe = viewerRef.onSnapshot(async (doc) => {
                const vd = doc.data();
                if (!vd || !vd.sdpOffer || !vd.iceRestart) return;
                if (vd.sdpOffer === lastOfferSdp) return; // Same offer, ignore
                if (signalingInProgress) return;
                if (!currentPC || currentPC !== pc || pc.signalingState === 'closed') return;

                signalingInProgress = true;
                lastOfferSdp = vd.sdpOffer;
                console.log('[LIVE] ICE restart offer received from broadcaster');
                showConnecting('Reconnecting...');

                try {
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: vd.sdpOffer }));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    const fullAnswer = await new Promise((resolve) => {
                        const t = setTimeout(() => resolve(pc.localDescription), 5000);
                        if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(pc.localDescription); return; }
                        pc.onicegatheringstatechange = () => {
                            if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(pc.localDescription); }
                        };
                    });
                    await viewerRef.update({ sdpAnswer: fullAnswer.sdp, status: 'connected', iceRestart: firebase.firestore.FieldValue.delete() });
                    console.log('[LIVE] ICE restart answer sent');
                } catch(e) {
                    console.warn('[LIVE] ICE restart re-negotiation failed:', e);
                } finally {
                    signalingInProgress = false;
                }
            });
        }

        // ============================================================
        //  RECONNECT
        // ============================================================
        function getBackoffDelay(attempt) {
            // Exponential backoff: 2s, 4s, 8s, 16s, 30s (capped)
            return Math.min(2000 * Math.pow(2, attempt - 1), 30000);
        }

        function scheduleReconnect(streamId) {
            if (retryCount >= MAX_RETRIES) {
                hideConnecting();
                showToast('Connection lost. Tap Streams to retry.', 'error');
                return;
            }
            retryCount++;
            const delay = getBackoffDelay(retryCount);
            showConnecting(`Reconnecting (${retryCount}/${MAX_RETRIES})...`);
            console.log(`[LIVE] Reconnect attempt ${retryCount} in ${delay}ms`);
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(async () => {
                try {
                    if (currentPC) { try { currentPC.close(); } catch(e) {} currentPC = null; }
                    await connectWebRTC(streamId);
                } catch (err) {
                    console.error('[LIVE] Reconnect failed:', err);
                    scheduleReconnect(streamId);
                }
            }, delay);
        }

        // ============================================================
        //  VIDEO STALL DETECTION
        // ============================================================
        function startStallDetection() {
            stopStallDetection();
            lastVideoTime = video.currentTime;
            stallCount = 0;
            stallCheckInterval = setInterval(() => {
                if (!isStreamActive || !currentPC) return;
                const iceState = currentPC.iceConnectionState;
                if (iceState !== 'connected' && iceState !== 'completed') {
                    // ICE itself isn't connected — other handlers will deal with it
                    stallCount = 0;
                    return;
                }
                if (video.currentTime === lastVideoTime && !video.paused) {
                    stallCount++;
                    if (stallCount >= 2) { // 2 checks × 3s = 6s stalled
                        console.log('[LIVE] Video stall detected (frozen for 6s while ICE connected)');
                        showToast('Stream stalled, reconnecting...', 'error');
                        stallCount = 0;
                        scheduleReconnect(currentStreamId);
                    }
                } else {
                    stallCount = 0;
                }
                lastVideoTime = video.currentTime;
            }, 3000);
        }

        function stopStallDetection() {
            if (stallCheckInterval) { clearInterval(stallCheckInterval); stallCheckInterval = null; }
            stallCount = 0;
        }

        // ============================================================
        //  STREAM LISTENER — detect stream end + viewer count updates
        // ============================================================
        function setupStreamListener(streamId) {
            if (offerUnsubscribe) offerUnsubscribe();

            let heartbeatWarned = false;

            offerUnsubscribe = window.firebaseDb.collection('liveStreams').doc(streamId)
                .onSnapshot((doc) => {
                    const d = doc.data();
                    if (!d) return;

                    if (d.status === 'ended') {
                        cleanup();
                        hideConnecting();
                        isStreamActive = false;
                        livePill.classList.remove('visible');
                        viewerCount.classList.remove('visible');
                        showToast('Stream has ended', 'info');
                        setTimeout(() => showPicker(), 1500);
                        return;
                    }

                    // Update viewer count in real-time
                    if (d.viewerCount !== undefined) {
                        viewerNum.textContent = Math.max(0, d.viewerCount);
                    }

                    // Broadcaster heartbeat check
                    if (d.lastHeartbeat && isStreamActive) {
                        const hbAge = (Date.now() - new Date(d.lastHeartbeat).getTime()) / 1000;
                        if (hbAge > 45 && !heartbeatWarned) {
                            heartbeatWarned = true;
                            showToast('Broadcaster may be offline', 'error');
                            showConnecting('Broadcaster unresponsive...');
                        } else if (hbAge <= 45 && heartbeatWarned) {
                            heartbeatWarned = false;
                            hideConnecting();
                            showToast('Broadcaster back', 'success');
                        }
                    }
                });
        }

        // ============================================================
        //  VIEWER POLLING (fallback for viewer count)
        // ============================================================
        function startViewerPolling(streamId) {
            if (viewerInterval) clearInterval(viewerInterval);
            viewerInterval = setInterval(async () => {
                try {
                    const doc = await window.firebaseDb.collection('liveStreams').doc(streamId).get();
                    const d = doc.data();
                    if (d) viewerNum.textContent = Math.max(0, d.viewerCount || 0);
                } catch(e) {}
            }, 8000);
        }

        // ============================================================
        //  WAKE LOCK — prevent screen dimming during stream
        // ============================================================
        async function acquireWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('[LIVE] Wake lock acquired');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch(e) { console.log('[LIVE] Wake lock not available'); }
        }
        function releaseWakeLock() {
            if (wakeLock) { try { wakeLock.release(); } catch(e) {} wakeLock = null; }
        }

        // ============================================================
        //  LIFECYCLE — visibility, beforeunload, wake lock re-acquire
        // ============================================================
        function setupLifecycle() {
            // Re-acquire wake lock when tab becomes visible again
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && isStreamActive) {
                    acquireWakeLock();
                }
            });

            // Auto-resume when network comes back online
            window.addEventListener('online', () => {
                console.log('[LIVE] Network back online');
                if (currentStreamId && !isStreamActive) {
                    showToast('Network restored, reconnecting...', 'info');
                    retryCount = 0; // Reset retries on fresh network
                    clearTimeout(reconnectTimer);
                    scheduleReconnect(currentStreamId);
                }
            });

            window.addEventListener('offline', () => {
                console.log('[LIVE] Network offline');
                if (isStreamActive || currentStreamId) {
                    showToast('Network offline', 'error');
                    showConnecting('Waiting for network...');
                    // Pause retries while offline
                    clearTimeout(reconnectTimer);
                }
            });

            // Cleanup viewer doc on page unload
            window.addEventListener('beforeunload', () => {
                if (currentStreamId && currentViewerId) {
                    // Use sendBeacon for reliable cleanup
                    // Firestore REST delete isn't trivial via sendBeacon, so just mark leaving
                    try {
                        window.firebaseDb.collection('liveStreams').doc(currentStreamId)
                            .collection('viewers').doc(currentViewerId).delete();
                        window.firebaseDb.collection('liveStreams').doc(currentStreamId).update({
                            viewerCount: firebase.firestore.FieldValue.increment(-1)
                        });
                    } catch(e) {}
                }
                releaseWakeLock();
            });

            // Handle page hide (mobile browsers)
            window.addEventListener('pagehide', () => {
                if (currentStreamId && currentViewerId) {
                    try {
                        window.firebaseDb.collection('liveStreams').doc(currentStreamId)
                            .collection('viewers').doc(currentViewerId).delete();
                        window.firebaseDb.collection('liveStreams').doc(currentStreamId).update({
                            viewerCount: firebase.firestore.FieldValue.increment(-1)
                        });
                    } catch(e) {}
                }
            });
        }

        // ============================================================
        //  STREAM INFO
        // ============================================================
        function setStreamInfo(data) {
            streamTitle.textContent = data.title || 'Live Stream';
            const parts = [];
            if (data.category) parts.push(`<span><i class="fas fa-tag"></i> ${escHtml(data.category)}</span>`);
            if (data.startedAt) parts.push(`<span><i class="fas fa-clock"></i> Started ${timeAgo(data.startedAt)}</span>`);
            parts.push(`<span><i class="fas fa-broadcast-tower"></i> KIUMA</span>`);
            streamMeta.innerHTML = parts.join('');
            livePill.classList.add('visible');
            viewerCount.classList.add('visible');
            streamInfo.classList.add('visible');
            viewerNum.textContent = data.viewerCount || 0;
        }

        // ============================================================
        //  UTILS
        // ============================================================
        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function timeAgo(ts) {
            if (!ts) return 'just now';
            const date = ts.toDate ? ts.toDate() : new Date(ts);
            const diff = Math.floor((Date.now() - date.getTime()) / 1000);
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return date.toLocaleDateString();
        }

        // ============================================================
        //  BOOT
        // ============================================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Expose for external use (e.g. deep links)
        window.streamPlayer = { watchStream, showPicker };
    })();
    </script>
</body>
</html>
