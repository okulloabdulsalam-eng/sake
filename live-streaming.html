<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KIUMA Live Streaming - Watch live Islamic lectures and events with adaptive video quality">
    <title>Live Streaming - KIUMA</title>
    <link rel="icon" href="logo.png" type="image/png">
    <script>
        // Immediately set theme before CSS renders to prevent dark-mode flash
        (function() {
            var t;
            try { t = localStorage.getItem('themePreference'); } catch(e) {}
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (t === 'system' || !t) {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="fonts/fontawesome.min.css">
    <!-- HLS.js for adaptive streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        .live-streaming-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px;
            font-family: 'Inter', sans-serif;
        }

        /* Hero Banner */
        .stream-hero {
            background: linear-gradient(135deg, #0d1b0e 0%, #1a3d1e 40%, #2a6b30 100%);
            color: white;
            padding: 36px 24px 28px;
            border-radius: 20px;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        .stream-hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 70%, rgba(212,175,55,0.08) 0%, transparent 50%);
            animation: heroGlow 8s ease-in-out infinite;
        }
        @keyframes heroGlow {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(5%,-5%); }
        }
        .stream-hero h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: #D4AF37;
            position: relative;
            letter-spacing: -0.5px;
        }
        .stream-hero p {
            font-size: 0.95rem;
            opacity: 0.85;
            position: relative;
            margin-bottom: 12px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e53935;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }
        .live-badge i { font-size: 8px; animation: livePulse 1.5s ease-in-out infinite; }
        @keyframes livePulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Video Player */
        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
            aspect-ratio: 16/9;
        }
        #videoPlayer {
            width: 100%; height: 100%;
            display: block;
            object-fit: contain;
            background: #111;
        }
        .video-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            padding: 16px 20px;
            display: flex; align-items: center; gap: 12px;
            opacity: 0; transition: opacity 0.3s;
        }
        .video-container:hover .video-controls { opacity: 1; }

        .control-btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 40px; height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.08);
        }

        .quality-selector {
            margin-left: auto;
            display: flex; align-items: center; gap: 6px;
        }
        .quality-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .quality-btn.active {
            background: var(--primary-green, #4CAF50);
            color: white;
            border-color: var(--primary-green, #4CAF50);
        }
        .quality-btn:hover { background: rgba(255,255,255,0.2); }

        .network-status {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .network-status.good { background: rgba(46,125,50,0.7); border-color: rgba(76,175,80,0.3); }
        .network-status.medium { background: rgba(230,126,34,0.7); border-color: rgba(255,152,0,0.3); }
        .network-status.poor { background: rgba(192,57,43,0.7); border-color: rgba(244,67,54,0.3); }

        /* Connection Status Toast */
        .connection-toast {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            color: white; padding: 20px 28px;
            border-radius: 14px; text-align: center;
            z-index: 15; border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 0.4s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translate(-50%,-45%); }
            to { opacity: 1; transform: translate(-50%,-50%); }
        }
        .connection-toast .spinner {
            width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #4CAF50; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Stream Cards */
        .upcoming-streams {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .upcoming-streams h2 {
            color: #1a3d1e;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .upcoming-streams h2 i { color: var(--primary-green, #4CAF50); }

        .stream-card {
            background: linear-gradient(135deg, #f8fdf8 0%, #f0f7f0 100%);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(76,175,80,0.12);
            transition: all 0.25s ease;
        }
        .stream-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76,175,80,0.12);
            border-color: rgba(76,175,80,0.3);
        }
        .stream-card h3 {
            font-size: 1rem; font-weight: 700;
            color: #1a3d1e; margin-bottom: 6px;
        }
        .stream-card .stream-time {
            color: var(--primary-green, #4CAF50);
            font-weight: 600; font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .stream-card .stream-description {
            color: #666; font-size: 0.85rem;
            padding: 0; background: none;
        }
        .stream-card .watch-btn {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: white; border: none;
            padding: 8px 20px; border-radius: 8px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; margin-top: 10px;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(46,125,50,0.2);
        }
        .stream-card .watch-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(46,125,50,0.3);
        }

        /* Stream Info Panel */
        .stream-info-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
        }
        .live-indicator {
            display: inline-flex; align-items: center; gap: 6px;
            background: #e53935; color: white;
            padding: 4px 10px; border-radius: 16px;
            font-weight: 700; font-size: 11px;
            letter-spacing: 0.5px;
        }
        .live-dot {
            width: 7px; height: 7px;
            background: white; border-radius: 50%;
            animation: livePulse 1.5s ease-in-out infinite;
        }
        .stream-title {
            color: #1a3d1e;
            font-size: 1.4rem;
            font-weight: 800;
            margin: 10px 0;
            letter-spacing: -0.3px;
        }
        .stream-meta {
            display: flex; gap: 16px; flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .meta-item {
            display: flex; align-items: center; gap: 5px;
            color: #888; font-size: 13px;
        }
        .meta-item i { color: var(--primary-green, #4CAF50); }
        .stream-actions {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .action-btn {
            padding: 7px 14px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 5px;
            transition: all 0.2s;
        }
        .share-btn { background: var(--primary-green, #4CAF50); color: white; }
        .share-btn:hover { background: #2E7D32; }
        .report-btn { background: #f5f5f5; color: #888; border: 1px solid #e0e0e0; }
        .report-btn:hover { background: #eee; }

        /* Host Controls */
        .host-controls {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
        }
        .host-controls h2 {
            color: #1a3d1e;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .host-tabs {
            display: flex; gap: 4px;
            margin-bottom: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 4px;
        }
        .host-tab {
            background: none; border: none;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px; font-weight: 600;
            color: #888;
            border-radius: 8px;
            transition: all 0.2s;
            flex: 1; text-align: center;
        }
        .host-tab:hover { color: #1a3d1e; }
        .host-tab.active {
            background: white;
            color: #1a3d1e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stream-request-form {
            background: #fafffe;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(76,175,80,0.12);
        }
        .stream-request-form h3 {
            color: #1a3d1e;
            margin-bottom: 16px;
            font-size: 1.05rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 13px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .submit-btn {
            background: linear-gradient(135deg, #2E7D32, #4CAF50);
            color: white; border: none;
            padding: 12px 28px; border-radius: 10px;
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 14px rgba(46,125,50,0.2);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46,125,50,0.3);
        }

        /* No streams */
        .no-streams {
            text-align: center; padding: 40px 20px;
            color: #aaa;
        }
        .no-streams i { font-size: 44px; margin-bottom: 12px; display: block; }
        .no-streams h3 { color: #666; margin-bottom: 6px; }
        .no-streams p { font-size: 0.9rem; }

        .loading-spinner {
            text-align: center; padding: 30px; color: #4CAF50;
        }
        .loading-spinner i { font-size: 36px; }

        /* Responsive */
        @media (max-width: 768px) {
            .stream-hero h1 { font-size: 1.4rem; }
            .stream-hero { padding: 24px 16px 20px; }
            .video-controls { padding: 12px; }
            .quality-selector { display: none; }
            .host-tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" style="display:flex;align-items:center;gap:8px;color:#D4AF37;text-decoration:none;font-weight:600;font-size:1rem;">
                <i class="fas fa-arrow-left" style="font-size:18px;"></i>
            </a>
        </div>
    </nav>

    <div class="live-streaming-container">
        <!-- Hero Section -->
        <div class="stream-hero">
            <h1><i class="fas fa-broadcast-tower"></i> Live Streaming</h1>
            <p>Watch live Islamic lectures, events, and programs with adaptive video quality</p>
            <div class="live-badge">
                <i class="fas fa-circle"></i>
                <span>LIVE NOW</span>
            </div>
        </div>

        <!-- Video Player -->
        <div class="video-container">
            <video id="videoPlayer" controls></video>
            
            <div class="video-controls">
                <button class="control-btn" id="playPauseBtn">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="muteBtn">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="control-btn" id="fullscreenBtn">
                    <i class="fas fa-expand"></i>
                </button>
                <div class="quality-selector">
                    <span style="color: white; font-size: 12px;">Quality:</span>
                    <button class="quality-btn" data-quality="auto">Auto</button>
                    <button class="quality-btn" data-quality="1080">1080p</button>
                    <button class="quality-btn" data-quality="720">720p</button>
                    <button class="quality-btn" data-quality="480">480p</button>
                    <button class="quality-btn" data-quality="360">360p</button>
                </div>
            </div>
            
            <div class="network-status" id="networkStatus">
                <i class="fas fa-wifi"></i>
                <span id="networkSpeed">Checking...</span>
            </div>
        </div>

        <!-- Ongoing Live Streams -->
        <div class="upcoming-streams">
            <h2><i class="fas fa-video"></i> Ongoing Live Streams</h2>
            <div id="upcomingStreams">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading live streams...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js" defer></script>
    <script src="firebase-config.js" defer></script>
    
    <!-- HLS.js for video streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        // Live streaming functionality with adaptive quality
        class AdaptiveLiveStream {
            constructor() {
                this.video = document.getElementById('videoPlayer');
                this.hls = null;
                this.currentQuality = 'auto';
                this.networkSpeed = 0;
                this.streamSources = {};
                
                this.init();
            }

            init() {
                this.setupVideoPlayer();
                this.setupControls();
                this.setupNetworkMonitoring();
                // Don't auto-load stream - wait for user to click
                this.loadUpcomingStreams();
            }

            setupVideoPlayer() {
                // Don't auto-load any content - wait for user selection
                console.log('📺 Video player ready - waiting for stream selection');
                
                // Setup HLS.js but don't load source yet
                if (Hls.isSupported()) {
                    this.hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 600,
                        maxBufferSize: 60 * 1000 * 1000,
                        maxBufferHole: 0.5
                    });

                    // Setup error handling
                    this.hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.error('Network error, trying to recover...');
                                    this.hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.error('Media error, trying to recover...');
                                    this.hls.recoverMediaError();
                                    break;
                                default:
                                    console.error('Fatal error:', data);
                                    this.showError('Stream loading failed. Please try again.');
                                    break;
                            }
                        }
                    });
                }
                
                // Show placeholder in video player
                this.showVideoPlaceholder();
            }

            showVideoPlaceholder() {
                // Add placeholder overlay to video
                const videoContainer = document.querySelector('.video-container');
                const placeholder = document.createElement('div');
                placeholder.className = 'video-placeholder';
                placeholder.innerHTML = `
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 10;">
                        <i class="fas fa-video" style="font-size: 48px; margin-bottom: 15px; opacity: 0.7;"></i>
                        <h3 style="margin: 0 0 10px 0;">Select a Live Stream</h3>
                        <p style="margin: 0; opacity: 0.7;">Choose a stream from the list below to start watching</p>
                    </div>
                `;
                placeholder.style.cssText = `
                    position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
                    background: rgba(0,0,0,0.8); display: flex; align-items: center; 
                    justify-content: center; z-index: 5; border-radius: 12px;
                `;
                
                // Insert before video controls
                const videoControls = document.querySelector('.video-controls');
                if (videoControls) {
                    videoContainer.insertBefore(placeholder, videoControls);
                }
            }

            hideVideoPlaceholder() {
                const placeholder = document.querySelector('.video-placeholder');
                if (placeholder) {
                    placeholder.remove();
                }
            }

            setupControls() {
                const playPauseBtn = document.getElementById('playPauseBtn');
                const muteBtn = document.getElementById('muteBtn');
                const fullscreenBtn = document.getElementById('fullscreenBtn');

                // Play/Pause
                playPauseBtn.addEventListener('click', () => {
                    if (this.video.paused) {
                        this.video.play();
                        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    } else {
                        this.video.pause();
                        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                });

                // Mute/Unmute
                muteBtn.addEventListener('click', () => {
                    this.video.muted = !this.video.muted;
                    muteBtn.innerHTML = this.video.muted ? 
                        '<i class="fas fa-volume-mute"></i>' : 
                        '<i class="fas fa-volume-up"></i>';
                });

                // Fullscreen
                fullscreenBtn.addEventListener('click', () => {
                    if (this.video.requestFullscreen) {
                        this.video.requestFullscreen();
                    } else if (this.video.webkitRequestFullscreen) {
                        this.video.webkitRequestFullscreen();
                    } else if (this.video.msRequestFullscreen) {
                        this.video.msRequestFullscreen();
                    }
                });

                // Quality buttons
                document.querySelectorAll('.quality-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const quality = btn.dataset.quality;
                        this.setQuality(quality);
                    });
                });

                // Update play/pause button
                this.video.addEventListener('play', () => {
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                });

                this.video.addEventListener('pause', () => {
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                });
            }

            setupNetworkMonitoring() {
                // Monitor network speed
                this.measureNetworkSpeed();
                setInterval(() => this.measureNetworkSpeed(), 10000);

                // Listen for network changes
                navigator.connection?.addEventListener('change', () => {
                    this.measureNetworkSpeed();
                    this.adjustQualityBasedOnNetwork();
                });
            }

            async measureNetworkSpeed() {
                try {
                    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    if (connection) {
                        this.networkSpeed = connection.downlink || 0;
                        this.updateNetworkStatus();
                    } else {
                        // Fallback: measure by downloading a small file
                        const startTime = Date.now();
                        const response = await fetch('https://httpbin.org/bytes/100000');
                        const endTime = Date.now();
                        const duration = (endTime - startTime) / 1000;
                        const size = 100000 * 8; // bits
                        this.networkSpeed = size / duration / 1000000; // Mbps
                        this.updateNetworkStatus();
                    }
                } catch (error) {
                    console.error('Network speed measurement failed:', error);
                    this.updateNetworkStatus('unknown');
                }
            }

            updateNetworkStatus(status = null) {
                const networkStatus = document.getElementById('networkStatus');
                const networkSpeed = document.getElementById('networkSpeed');
                
                // Check if elements exist before trying to use them
                if (!networkStatus || !networkSpeed) {
                    console.warn('⚠️ Network status elements not found');
                    return;
                }
                
                const speed = status !== null ? status : this.networkSpeed;
                
                networkStatus.className = 'network-status';
                
                if (speed === 'unknown') {
                    networkSpeed.textContent = 'Unknown';
                } else if (speed > 5) {
                    networkStatus.classList.add('good');
                    networkSpeed.textContent = `${speed.toFixed(1)} Mbps`;
                } else if (speed > 1) {
                    networkStatus.classList.add('medium');
                    networkSpeed.textContent = `${speed.toFixed(1)} Mbps`;
                } else {
                    networkStatus.classList.add('poor');
                    networkSpeed.textContent = `${speed.toFixed(1)} Mbps`;
                }

            adjustQualityBasedOnNetwork() {
                if (this.currentQuality !== 'auto') return;

                const speed = this.networkSpeed;
                let recommendedQuality = 'auto';

                if (speed > 8) {
                    recommendedQuality = '1080';
                } else if (speed > 4) {
                    recommendedQuality = '720';
                } else if (speed > 2) {
                    recommendedQuality = '480';
                } else if (speed > 0.5) {
                    recommendedQuality = '360';
                } else {
                    recommendedQuality = 'auto';
                }

                this.setQuality(recommendedQuality);
            }

            setQuality(quality) {
                this.currentQuality = quality;
                
                // Update button states
                document.querySelectorAll('.quality-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.quality === quality) {
                        btn.classList.add('active');
                    }
                });

                // Change stream source
                if (this.hls) {
                    if (quality === 'auto') {
                        this.hls.currentLevel = -1; // Auto
                    } else {
                        const level = parseInt(quality);
                        const levels = this.hls.levels;
                        const targetLevel = levels.findIndex(l => l.height === level);
                        if (targetLevel !== -1) {
                            this.hls.currentLevel = targetLevel;
                        }
                    }
                } else {
                    this.video.src = this.streamSources[quality];
                }
            }

                // Update quality buttons based on available levels
                const qualities = ['auto', '1080', '720', '480', '360'];
                qualities.forEach(quality => {

                    if (btn) {
                        if (quality === 'auto') {
                            btn.style.display = 'inline-block';
                        } else {
                            const level = levels.find(l => l.height === parseInt(quality));
                            btn.style.display = level ? 'inline-block' : 'none';

            handleWebRTCStream(streamId) {
                console.log('🌐 Connecting to live stream:', streamId);
                this.showSuccess('Connecting to live stream...');
                this._currentStreamId = streamId;
                this._retryCount = 0;
                this._maxRetries = 5;
                this.connectToWebRTCStream(streamId).catch(error => {
                    console.error('❌ Stream connection failed:', error);
                    this.showError('Could not connect: ' + error.message);
                    this._scheduleReconnect(streamId);
                });
                
                // Listen for SDP offer changes (admin camera switch / re-signal)
                this._setupOfferListener(streamId);
            }
            
            _setupOfferListener(streamId) {
                // Stop previous listener
                if (this._offerUnsubscribe) {
                    this._offerUnsubscribe();
                }
                
                let lastOffer = null;
                this._offerUnsubscribe = window.firebaseDb.collection('liveStreams').doc(streamId)
                    .onSnapshot((doc) => {
                        const data = doc.data();
                        if (!data) return;
                        
                        // If stream ended, stop listening
                        if (data.status === 'ended') {
                            this.showError('Stream has ended.');
                            if (this._offerUnsubscribe) this._offerUnsubscribe();
                            return;
                        }
                        
                        // If SDP offer changed (admin re-signaled), auto-reconnect
                        if (data.sdpOffer && lastOffer && data.sdpOffer !== lastOffer) {
                            console.log('📡 Admin re-signaled — auto-reconnecting...');
                            this._retryCount = 0;
                            this.watchStream(streamId);
                        }
                        lastOffer = data.sdpOffer;
                    });
            }
            
            _scheduleReconnect(streamId) {
                if (this._retryCount >= this._maxRetries) {
                    this.showError('Connection failed after multiple attempts. Tap Watch again.');
                    return;
                }
                this._retryCount++;
                console.log(`🔄 Auto-reconnect attempt ${this._retryCount}/${this._maxRetries} in 3s...`);
                this.showSuccess(`Reconnecting... (${this._retryCount}/${this._maxRetries})`);
                
                clearTimeout(this._reconnectTimer);
                this._reconnectTimer = setTimeout(() => {
                    this.connectToWebRTCStream(streamId).catch(error => {
                        console.error('❌ Reconnect failed:', error);
                        this._scheduleReconnect(streamId);
                    });
                }, 3000);
            }

            async connectToWebRTCStream(streamId) {
                // 1. Get admin's complete SDP offer from Firestore
                const streamDoc = await window.firebaseDb.collection('liveStreams').doc(streamId).get();
                const streamData = streamDoc.data();
                
                if (!streamData || !streamData.sdpOffer) {
                    throw new Error('Stream not found or not ready');
                }
                
                if (streamData.status === 'ended') {
                    throw new Error('Stream has ended');
                }
                
                console.log('📥 Got admin SDP offer from Firestore');
                
                // Close old connection
                if (this._currentPC) {
                    try { this._currentPC.close(); } catch(e) {}
                }
                
                // 2. Create peer connection with same STUN servers
                const pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' }
                    ]
                });
                this._currentPC = pc;
                
                // Handle incoming video/audio tracks
                pc.ontrack = (event) => {
                    console.log('📹 Received track:', event.track.kind);
                    if (event.streams && event.streams[0]) {
                        this.video.srcObject = event.streams[0];
                    } else {
                        let s = this.video.srcObject;
                        if (!s || !(s instanceof MediaStream)) {
                            s = new MediaStream();
                            this.video.srcObject = s;
                        }
                        s.addTrack(event.track);
                    }
                    this.video.play().catch(() => {});
                    this._retryCount = 0; // Reset retries on success
                    this.showSuccess('🔴 Watching live stream!');
                };
                
                pc.oniceconnectionstatechange = () => {
                    console.log('🔗 Viewer ICE state:', pc.iceConnectionState);
                    if (pc.iceConnectionState === 'connected') {
                        this._retryCount = 0;
                        this.showSuccess('🔴 Connected — streaming live!');
                    } else if (pc.iceConnectionState === 'disconnected') {
                        this.showSuccess('Reconnecting...');
                        // Wait briefly — disconnected often recovers
                        setTimeout(() => {
                            if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                                this._scheduleReconnect(streamId);
                            }
                        }, 3000);
                    } else if (pc.iceConnectionState === 'failed') {
                        this._scheduleReconnect(streamId);
                    }
                };
                
                // 3. Set admin's offer as remote description
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: 'offer',
                    sdp: streamData.sdpOffer
                }));
                console.log('✅ Admin offer set as remote description');
                
                // 4. Create answer
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                // 5. Wait for ALL ICE candidates to be gathered (no trickle)
                const fullAnswer = await new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        console.log('⏱️ ICE gathering timeout, using current SDP');
                        resolve(pc.localDescription);
                    }, 5000);
                    
                    if (pc.iceGatheringState === 'complete') {
                        clearTimeout(timeout);
                        resolve(pc.localDescription);
                        return;
                    }
                    
                    pc.onicegatheringstatechange = () => {
                        if (pc.iceGatheringState === 'complete') {
                            clearTimeout(timeout);
                            console.log('✅ Viewer ICE gathering complete');
                            resolve(pc.localDescription);
                        }
                    };
                });
                
                // 6. Save complete answer SDP to Firestore
                await window.firebaseDb.collection('liveStreams').doc(streamId).update({
                    sdpAnswer: fullAnswer.sdp
                });
                console.log('✅ Full answer saved to Firestore');
                
                // Increment viewer count (only on first connect)
                if (this._retryCount === 0) {
                    try {
                        await window.firebaseDb.collection('liveStreams').doc(streamId).update({
                            viewerCount: firebase.firestore.FieldValue.increment(1)
                        });
                    } catch(e) {}
                }
                
                this.showSuccess('Connecting to stream...');
            }

        // Stream Request System
        class StreamRequestSystem {
            constructor() {
                this.currentUser = null;
                this.streamRequests = [];
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.testFirebaseConnection();
                this.loadStreamRequests();
                this.loadApprovedStreams();
            }

            async testFirebaseConnection() {
                try {
                    if (!window.firebaseDb) {
                        console.warn('Firebase not available - checking if scripts are loaded...');
                        // Check if Firebase scripts are loaded
                        if (typeof firebase === 'undefined') {
                            console.error('Firebase SDK not loaded. Check firebase-config.js script tag.');
                            this.showErrorMessage('Firebase not loaded. Please refresh the page.');
                        } else if (!firebase.firestore) {
                            console.error('Firebase Firestore not available. Check Firebase configuration.');
                            this.showErrorMessage('Database not available. Please refresh the page.');
                        }
                        return;
                    }

                    // Test connection with a simple read
                    const testDoc = await window.firebaseDb.collection('streamRequests').limit(1).get();
                    console.log('Firebase connection test successful');
                    
                } catch (error) {
                    console.error('Firebase connection test failed:', error);
                    if (error.code === 'permission-denied') {
                        console.warn('Permission denied - check Firestore rules');
                    } else if (error.code === 'unavailable') {
                        console.warn('Firebase unavailable - check network connection');
                    }
                }
            }

            setupEventListeners() {
                // Stream request form
                const form = document.getElementById('streamRequestForm');
                if (form) {
                    form.addEventListener('submit', (e) => this.handleStreamRequest(e));
                }

                // Set minimum datetime to now
                const datetimeInput = document.getElementById('streamTime');
                if (datetimeInput) {
                    const now = new Date();
                    const offset = now.getTimezoneOffset() * 60000;
                    const localISOTime = new Date(now - offset).toISOString().slice(0, 16);
                    datetimeInput.min = localISOTime;
                }
            }

            async loadCurrentUser() {
                try {
                    // Get current user from Firebase Auth
                    if (window.firebase && window.firebase.auth) {
                        const user = window.firebase.auth().currentUser;
                        if (user) {
                            this.currentUser = {
                                uid: user.uid,
                                email: user.email,
                                displayName: user.displayName || user.email
                            };
                        }
                    }
                } catch (error) {
                    console.error('Error loading current user:', error);
                }
            }

            async loadStreamRequests() {
                try {
                    if (!window.firebaseDb) return;

                    const snapshot = await window.firebaseDb
                        .collection('streamRequests')
                        .where('hostId', '==', this.currentUser?.uid || 'anonymous')
                        .orderBy('requestedAt', 'desc')
                        .get();

                    this.streamRequests = [];
                    snapshot.forEach(doc => {
                        this.streamRequests.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });

                    this.renderMyStreamRequests();
                } catch (error) {
                    console.error('Error loading stream requests:', error);
                    this.renderMyStreamRequestsError();
                }
            }

            async loadApprovedStreams() {
                try {
                    if (!window.firebaseDb) return;

                    const snapshot = await window.firebaseDb
                        .collection('streamRequests')
                        .where('hostId', '==', this.currentUser?.uid || 'anonymous')
                        .where('status', '==', 'approved')
                        .orderBy('scheduledTime', 'desc')
                        .get();

                    const approvedStreams = [];
                    snapshot.forEach(doc => {
                        approvedStreams.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });

                    this.renderApprovedStreams(approvedStreams);
                } catch (error) {
                    console.error('Error loading approved streams:', error);
                    this.renderApprovedStreamsError();
                }
            }

            async handleStreamRequest(event) {
                event.preventDefault();
                
                const formData = new FormData(event.target);
                const streamData = {
                    hostId: this.currentUser?.uid || 'anonymous',
                    hostEmail: this.currentUser?.email || 'anonymous@example.com',
                    hostName: this.currentUser?.displayName || 'Anonymous User',
                    title: formData.get('title'),
                    description: formData.get('description'),
                    category: formData.get('category'),
                    scheduledTime: new Date(formData.get('scheduledTime')).toISOString(),
                    duration: parseInt(formData.get('duration')) || 60,
                    quality: formData.get('quality'),
                    status: 'pending',
                    requestedAt: new Date().toISOString(),
                    approvedAt: null,
                    approvedBy: null,
                    denialReason: null,
                    viewerCount: 0,
                    isActive: false
                };

                try {
                    // Check if Firebase is available
                    if (!window.firebaseDb) {
                        throw new Error('Firebase Firestore is not available. Please check your connection and refresh the page.');
                    }

                    // Save to Firebase
                    console.log('Submitting stream request:', streamData);
                    const docRef = await window.firebaseDb.collection('streamRequests').add(streamData);
                    console.log('Stream request saved with ID:', docRef.id);
                    
                    // Update stream data with the document ID
                    streamData.id = docRef.id;
                    
                    // Send notification to admins (non-blocking)
                    try {
                        await this.notifyAdmins(streamData);
                    } catch (notifError) {
                        console.warn('Notification failed but stream request was saved:', notifError);
                    }
                    
                    // Reset form
                    event.target.reset();
                    
                    // Show success message
                    this.showSuccessMessage('Stream request submitted successfully! Admins will review your request shortly.');
                    
                    // Reload requests
                    await this.loadStreamRequests();
                    
                } catch (error) {
                    console.error('Error submitting stream request:', error);
                    
                    // Provide more specific error messages
                    let errorMessage = 'Failed to submit stream request. Please try again.';
                    if (error.message.includes('permission-denied')) {
                        errorMessage = 'Permission denied. Please check your account permissions.';
                    } else if (error.message.includes('unavailable')) {
                        errorMessage = 'Service unavailable. Please check your internet connection and try again.';
                    } else if (error.message.includes('Firebase')) {
                        errorMessage = 'Database connection error. Please refresh the page and try again.';
                    }
                    
                    this.showErrorMessage(errorMessage);
                }
            }

            async notifyAdmins(streamData) {
                try {
                    // Create notification for admins
                    const notification = {
                        title: 'New Stream Request',
                        message: `${streamData.hostName} requested to stream: "${streamData.title}"`,
                        category: 'stream_request',
                        icon: 'fas fa-video',
                        status: 'unread',
                        createdAt: new Date(),
                        data: {
                            requestId: streamData.id || 'pending',
                            hostId: streamData.hostId,
                            title: streamData.title
                        }
                    };

                    await window.firebaseDb.collection('notifications').add(notification);
                } catch (error) {
                    console.error('Error notifying admins:', error);
                }
            }

            renderMyStreamRequests() {
                const container = document.getElementById('myStreamRequests');
                if (!container) return;

                if (this.streamRequests.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-gray);">
                            <i class="fas fa-video-slash" style="font-size: 48px; margin-bottom: 15px;"></i>
                            <p>You haven't requested any streams yet.</p>
                            <button onclick="showHostTab('request')" class="action-btn" style="margin-top: 15px;">
                                <i class="fas fa-plus"></i> Request Your First Stream
                            </button>
                        </div>
                    `;
                    return;
                }

                const html = this.streamRequests.map(request => this.renderStreamRequestCard(request)).join('');
                container.innerHTML = html;
            }

            renderStreamRequestCard(request) {
                const scheduledTime = new Date(request.scheduledTime);
                const formattedTime = scheduledTime.toLocaleString();
                
                return `
                    <div class="stream-request-card">
                        <h4>${request.title}</h4>
                        <p>${request.description}</p>
                        <div class="stream-request-meta">
                            <span><i class="fas fa-calendar"></i> ${formattedTime}</span>
                            <span><i class="fas fa-clock"></i> ${request.duration} minutes</span>
                            <span><i class="fas fa-tag"></i> ${request.category}</span>
                            <span><i class="fas fa-video"></i> ${request.quality}</span>
                        </div>
                        <div class="stream-request-meta">
                            <span class="stream-status ${request.status}">${request.status}</span>
                            ${request.approvedAt ? `<span><i class="fas fa-check"></i> Approved ${new Date(request.approvedAt).toLocaleDateString()}</span>` : ''}
                            ${request.denialReason ? `<span style="color: #dc3545;"><i class="fas fa-times"></i> ${request.denialReason}</span>` : ''}
                        </div>
                        ${request.status === 'approved' ? `
                            <div style="margin-top: 15px;">
                                <button class="action-btn" onclick="startStream('${request.id}')">
                                    <i class="fas fa-play"></i> Start Stream
                                </button>
                                <button class="action-btn danger" onclick="cancelStreamRequest('${request.id}')">
                                    <i class="fas fa-times"></i> Cancel
                                </button>
                            </div>
                        ` : ''}
                        ${request.status === 'pending' ? `
                            <div style="margin-top: 15px;">
                                <button class="action-btn danger" onclick="cancelStreamRequest('${request.id}')">
                                    <i class="fas fa-times"></i> Cancel Request
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderApprovedStreams(approvedStreams) {
                const container = document.getElementById('approvedStreams');
                if (!container) return;

                if (approvedStreams.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-gray);">
                            <i class="fas fa-video-slash" style="font-size: 48px; margin-bottom: 15px;"></i>
                            <p>You don't have any approved streams yet.</p>
                        </div>
                    `;
                    return;
                }

                const html = approvedStreams.map(request => this.renderApprovedStreamCard(request)).join('');
                container.innerHTML = html;
            }

            renderApprovedStreamCard(request) {
                const scheduledTime = new Date(request.scheduledTime);
                const isNow = Date.now() >= scheduledTime.getTime() - 30 * 60 * 1000; // 30 minutes before
                const isPast = Date.now() > scheduledTime.getTime() + parseInt(request.duration) * 60 * 1000;
                
                return `
                    <div class="stream-request-card">
                        <h4>${request.title}</h4>
                        <p>${request.description}</p>
                        <div class="stream-request-meta">
                            <span><i class="fas fa-calendar"></i> ${scheduledTime.toLocaleString()}</span>
                            <span><i class="fas fa-clock"></i> ${request.duration} minutes</span>
                            <span><i class="fas fa-tag"></i> ${request.category}</span>
                        </div>
                        <div class="stream-request-meta">
                            <span class="stream-status ${request.isActive ? 'active' : 'approved'}">
                                ${request.isActive ? 'Live Now' : 'Approved'}
                            </span>
                        </div>
                        <div style="margin-top: 15px;">
                            ${!request.isActive && !isPast && isNow ? `
                                <button class="action-btn" onclick="startStream('${request.id}')">
                                    <i class="fas fa-play"></i> Start Stream Now
                                </button>
                            ` : ''}
                            ${request.isActive ? `
                                <button class="action-btn danger" onclick="stopStream('${request.id}')">
                                    <i class="fas fa-stop"></i> Stop Stream
                                </button>
                            ` : ''}
                            <button class="action-btn" onclick="editStream('${request.id}')">
                                <i class="fas fa-edit"></i> Edit Details
                            </button>
                        </div>
                    </div>
                `;
            }

            renderMyStreamRequestsError() {
                const container = document.getElementById('myStreamRequests');
                if (container) {
                    container.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Failed to load your stream requests. Please refresh the page.</p>
                        </div>
                    `;
                }
            }

            renderApprovedStreamsError() {
                const container = document.getElementById('approvedStreams');
                if (container) {
                    container.innerHTML = `
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Failed to load approved streams. Please refresh the page.</p>
                        </div>
                    `;
                }
            }

            showSuccessMessage(message) {
                // Create success notification
                const notification = document.createElement('div');
                notification.className = 'success-notification';
                notification.innerHTML = `
                    <i class="fas fa-check-circle"></i>
                    <span>${message}</span>
                `;
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #d4edda;
                    color: #155724;
                    padding: 15px 20px;
                    border-radius: 8px;
                    border-left: 4px solid #28a745;
                    z-index: 1000;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }

            showErrorMessage(message) {
                // Create error notification
                const notification = document.createElement('div');
                notification.className = 'error-notification';
                notification.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <span>${message}</span>
                `;
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #f8d7da;
                    color: #721c24;
                    padding: 15px 20px;
                    border-radius: 8px;
                    border-left: 4px solid #dc3545;
                    z-index: 1000;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }
        }

        // Tab switching functionality
        function showHostTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.host-tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            
            // Remove active class from all tab buttons
            document.querySelectorAll('.host-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + 'Tab').style.display = 'block';
            
            // Add active class to clicked tab button
            event.target.classList.add('active');
        }

        // Stream control functions
        async function startStream(requestId) {
            try {
                await window.firebaseDb.collection('streamRequests').doc(requestId).update({
                    isActive: true,
                    startedAt: new Date().toISOString()
                });
                
                alert('Stream started! Your stream is now live.');
                
                // Reload the approved streams
                if (window.streamRequestSystem) {
                    await window.streamRequestSystem.loadApprovedStreams();
                }
            } catch (error) {
                console.error('Error starting stream:', error);
                alert('Failed to start stream. Please try again.');
            }
        }

        async function stopStream(requestId) {
            try {
                await window.firebaseDb.collection('streamRequests').doc(requestId).update({
                    isActive: false,
                    stoppedAt: new Date().toISOString()
                });
                
                alert('Stream stopped.');
                
                // Reload the approved streams
                if (window.streamRequestSystem) {
                    await window.streamRequestSystem.loadApprovedStreams();
                }
            } catch (error) {
                console.error('Error stopping stream:', error);
                alert('Failed to stop stream. Please try again.');
            }
        }

        async function cancelStreamRequest(requestId) {
            if (!confirm('Are you sure you want to cancel this stream request?')) {
                return;
            }
            
            try {
                await window.firebaseDb.collection('streamRequests').doc(requestId).delete();
                
                alert('Stream request cancelled.');
                
                // Reload the requests
                if (window.streamRequestSystem) {
                    await window.streamRequestSystem.loadStreamRequests();
                    await window.streamRequestSystem.loadApprovedStreams();
                }
            } catch (error) {
                console.error('Error cancelling stream request:', error);
                alert('Failed to cancel stream request. Please try again.');
            }
        }

        function editStream(requestId) {
            // TODO: Implement edit functionality
            alert('Edit functionality coming soon!');
        }

        // Make stream request system globally accessible
        window.streamRequestSystem = null;
        
        // Create global streamPlayer instance
        window.streamPlayer = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            window.streamRequestSystem = new StreamRequestSystem();
            window.streamPlayer = new AdaptiveLiveStream();
            console.log('✅ streamPlayer initialized:', window.streamPlayer);
        });
    </script>
</body>
