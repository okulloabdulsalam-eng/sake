<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIUMA - Download App</title>
    <meta name="description" content="Download the KIUMA mobile app for Android">
    <meta name="theme-color" content="#4CAF50">
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 50%, #0d1b2a 100%);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(76,175,80,0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .tagline {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .version-badge {
            display: inline-block;
            background: rgba(76,175,80,0.15);
            color: #81C784;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 28px;
            border: 1px solid rgba(76,175,80,0.25);
        }
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 6px 20px rgba(76,175,80,0.4);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(76,175,80,0.5);
        }
        .download-btn:active { transform: translateY(0); }
        .download-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .info {
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            line-height: 1.6;
        }
        .info a { color: rgba(255,255,255,0.6); }
        .size { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 10px; }
        .steps {
            margin-top: 28px;
            text-align: left;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 18px 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .steps h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.5);
            margin-bottom: 12px;
        }
        .steps ol {
            list-style: none;
            counter-reset: step;
            padding: 0;
        }
        .steps li {
            counter-increment: step;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            padding: 6px 0;
            padding-left: 28px;
            position: relative;
        }
        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(76,175,80,0.2);
            color: #81C784;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="KIUMA" class="logo" onerror="this.style.display='none'">
        <h1>KIUMA</h1>
        <p class="tagline">Kampala Islamic University Muslim Association</p>
        <div class="version-badge">v1.6.3 &bull; Android</div>

        <a href="https://okulloabdulsalam-eng.github.io/sake/kiuma-v1.6.3.apk" class="download-btn" id="downloadBtn">
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h5.66V9h3.84L12 2z" transform="rotate(180 12 12)"/></svg>
            Download APK
        </a>
        <p class="size">3.7 MB</p>

        <div class="steps">
            <h3>Installation</h3>
            <ol>
                <li>Tap <strong>Download APK</strong> above</li>
                <li>Open the downloaded file</li>
                <li>Allow "Install from unknown sources" if prompted</li>
                <li>Tap <strong>Install</strong> and open the app</li>
            </ol>
        </div>

        <p class="info">
            Requires Android 7.0+<br>
            <a href="https://okulloabdulsalam-eng.github.io/sake/" target="_blank">Visit Web App</a>
        </p>
    </div>
</body>
</html>
