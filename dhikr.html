<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Dhikr Counter - KIUMA</title>
    <link rel="manifest" href="manifest.json">
    <script>
        (function() {
            var t;
            try { t = localStorage.getItem('themePreference'); } catch(e) {}
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: var(--gray);
            padding-bottom: 0;
        }
        .container {
            max-width: 428px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
        }
        .dhikr-header {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dhikr-header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 20px;
            background: var(--white);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .dhikr-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }
        .dhikr-back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .dhikr-title {
            font-size: 18px;
            font-weight: 600;
        }
        .dhikr-actions button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Dhikr Selector */
        .dhikr-selector {
            padding: 20px 15px;
        }
        .dhikr-tabs {
            display: flex;
            background: var(--gray);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .dhikr-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dhikr-tab.active {
            background: var(--primary-green);
            color: white;
        }

        /* Dhikr Cards */
        .dhikr-cards {
            display: grid;
            gap: 12px;
        }
        .dhikr-card {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            box-shadow: var(--shadow);
            cursor: default;
            border-left: 4px solid var(--primary-green);
        }
        .dhikr-card-arabic {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: var(--dark-gray);
            margin-bottom: 8px;
            direction: rtl;
            text-align: right;
        }
        .dhikr-card-transliteration {
            font-size: 14px;
            color: var(--primary-green);
            font-weight: 500;
            margin-bottom: 4px;
        }
        .dhikr-card-meaning {
            font-size: 13px;
            color: var(--text-gray);
        }
        .dhikr-card-target {
            font-size: 12px;
            color: var(--primary-green);
            margin-top: 8px;
            font-weight: 500;
        }

        /* Counter Section */
        .counter-section {
            padding: 20px 15px 100px;
            text-align: center;
        }
        .current-dhikr {
            background: linear-gradient(135deg, var(--lighter-green), var(--white));
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .current-dhikr-arabic {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: var(--dark-green);
            margin-bottom: 10px;
            direction: rtl;
        }
        .current-dhikr-meaning {
            font-size: 14px;
            color: var(--text-gray);
        }

        /* Big Counter */
        .counter-display {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
        }
        .counter-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(76, 175, 80, 0.3);
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .counter-circle:active {
            transform: scale(0.95);
        }
        .counter-number {
            font-size: 72px;
            font-weight: 700;
            color: white;
            line-height: 1;
        }
        .counter-label {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-top: 5px;
        }
        .counter-progress {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
        }
        .counter-progress svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .counter-progress circle {
            fill: none;
            stroke-width: 4;
        }
        .counter-progress .bg {
            stroke: var(--lighter-green);
        }
        .counter-progress .fg {
            stroke: #FFD700;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s;
        }

        /* Counter Controls */
        .counter-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--gray);
            color: var(--dark-gray);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: var(--light-gray);
        }
        .control-btn.reset {
            background: #ffebee;
            color: #f44336;
        }

        /* Stats */
        .dhikr-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: var(--gray);
            border-radius: 12px;
            padding: 15px 10px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-green);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        /* Target Selector */
        .target-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .target-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--light-gray);
            background: var(--white);
            color: var(--text-gray);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .target-btn.active {
            border-color: var(--primary-green);
            background: var(--lighter-green);
            color: var(--dark-green);
        }

        /* Vibration feedback indicator */
        .vibrate-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(76, 175, 80, 0.3);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .vibrate-indicator.pulse {
            animation: ripple 0.4s ease-out;
        }
        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* Completion celebration */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .celebration.show {
            opacity: 1;
            visibility: visible;
        }
        .celebration-content {
            text-align: center;
            color: white;
        }
        .celebration-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .celebration h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .celebration p {
            font-size: 16px;
            opacity: 0.8;
        }
        .celebration-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-hero-compact">
            <div class="hero-deco"></div>
            <div class="hero-compact-nav">
                <button class="hero-back-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="hero-compact-actions">
                    <button onclick="toggleSound()"><i class="fas fa-volume-up" id="soundIcon"></i></button>
                </div>
            </div>
            <div class="hero-compact-title">
                <h1>Dhikr Counter</h1>
                <p>Remember Allah with daily adhkar</p>
                <div class="hero-accent-line"></div>
            </div>
        </div>

        <!-- Dhikr Selection -->
        <div class="dhikr-selector" id="dhikrSelector">
            <div class="dhikr-tabs">
                <button class="dhikr-tab active" onclick="filterDhikr('all')">All</button>
                <button class="dhikr-tab" onclick="filterDhikr('morning')">Morning</button>
                <button class="dhikr-tab" onclick="filterDhikr('evening')">Evening</button>
            </div>
            <div class="dhikr-cards" id="dhikrCards"></div>
        </div>

        <!-- Counter Section (hidden initially) -->
        <div class="counter-section" id="counterSection" style="display:none;">
            <div class="current-dhikr">
                <div class="current-dhikr-arabic" id="currentArabic"></div>
                <div class="current-dhikr-meaning" id="currentMeaning"></div>
            </div>

            <div class="counter-display">
                <div class="counter-progress">
                    <svg viewBox="0 0 230 230">
                        <circle class="bg" cx="115" cy="115" r="108"></circle>
                        <circle class="fg" id="progressCircle" cx="115" cy="115" r="108" 
                            stroke-dasharray="679" stroke-dashoffset="679"></circle>
                    </svg>
                </div>
                <div class="counter-circle" id="counterCircle" onclick="incrementCounter()">
                    <span class="counter-number" id="counterNumber">0</span>
                    <span class="counter-label">Tap to count</span>
                </div>
            </div>

            <div class="counter-controls">
                <button class="control-btn" onclick="decrementCounter()">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="control-btn reset" onclick="resetCounter()">
                    <i class="fas fa-redo"></i>
                </button>
                <button class="control-btn" onclick="showDhikrSelector()">
                    <i class="fas fa-list"></i>
                </button>
            </div>

            <div class="dhikr-stats">
                <div class="stat-item">
                    <div class="stat-value" id="todayCount">0</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="targetProgress">0%</div>
                    <div class="stat-label">Progress</div>
                </div>
            </div>

            <div class="target-selector">
                <button class="target-btn" onclick="setTarget(33)">33</button>
                <button class="target-btn active" onclick="setTarget(100)">100</button>
                <button class="target-btn" onclick="setTarget(500)">500</button>
                <button class="target-btn" onclick="setTarget(1000)">1000</button>
            </div>
        </div>

        <div class="vibrate-indicator" id="vibrateIndicator"></div>
    </div>

    <!-- Celebration Modal -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-icon">🎉</div>
            <h2>MashaAllah!</h2>
            <p>You completed <span id="celebrationTarget">100</span> dhikr!</p>
            <button class="celebration-btn" onclick="closeCelebration()">Continue</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const DHIKR_STORAGE_KEY = 'dhikr_data';
        
        const dhikrList = [
            { id: 1, arabic: 'سُبْحَانَ اللَّهِ', transliteration: 'SubhanAllah', meaning: 'Glory be to Allah', category: 'morning', defaultTarget: 33 },
            { id: 2, arabic: 'الْحَمْدُ لِلَّهِ', transliteration: 'Alhamdulillah', meaning: 'All praise is due to Allah', category: 'morning', defaultTarget: 33 },
            { id: 3, arabic: 'اللَّهُ أَكْبَرُ', transliteration: 'Allahu Akbar', meaning: 'Allah is the Greatest', category: 'morning', defaultTarget: 33 },
            { id: 4, arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ', transliteration: 'La ilaha illallah', meaning: 'There is no god but Allah', category: 'morning', defaultTarget: 100 },
            { id: 5, arabic: 'أَسْتَغْفِرُ اللَّهَ', transliteration: 'Astaghfirullah', meaning: 'I seek forgiveness from Allah', category: 'evening', defaultTarget: 100 },
            { id: 6, arabic: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', transliteration: 'SubhanAllahi wa bihamdihi', meaning: 'Glory and praise be to Allah', category: 'morning', defaultTarget: 100 },
            { id: 7, arabic: 'سُبْحَانَ اللَّهِ الْعَظِيمِ', transliteration: 'SubhanAllahil Azeem', meaning: 'Glory be to Allah the Almighty', category: 'morning', defaultTarget: 100 },
            { id: 8, arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', transliteration: 'La hawla wa la quwwata illa billah', meaning: 'There is no power except with Allah', category: 'evening', defaultTarget: 100 },
            { id: 9, arabic: 'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ', transliteration: 'Allahumma salli ala Muhammad', meaning: 'O Allah, send blessings upon Muhammad', category: 'evening', defaultTarget: 100 },
            { id: 10, arabic: 'سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ', transliteration: 'SubhanAllah wal hamdulillah...', meaning: 'The four praises', category: 'evening', defaultTarget: 100 }
        ];

        let currentDhikr = null;
        let count = 0;
        let target = 100;
        let soundEnabled = true;
        let data = { today: {}, total: {}, lastDate: '' };

        // Load saved data
        function loadData() {
            try {
                const saved = localStorage.getItem(DHIKR_STORAGE_KEY);
                if (saved) {
                    data = JSON.parse(saved);
                    // Reset today if date changed
                    const today = new Date().toDateString();
                    if (data.lastDate !== today) {
                        data.today = {};
                        data.lastDate = today;
                        saveData();
                    }
                }
            } catch(e) {}
        }

        function saveData() {
            localStorage.setItem(DHIKR_STORAGE_KEY, JSON.stringify(data));
        }

        function renderDhikrCards(filter = 'all') {
            const container = document.getElementById('dhikrCards');
            const filtered = filter === 'all' ? dhikrList : dhikrList.filter(d => d.category === filter);
            
            container.innerHTML = filtered.map(dhikr => `
                <div class="dhikr-card">
                    <div class="dhikr-card-arabic">${dhikr.arabic}</div>
                    <div class="dhikr-card-transliteration">${dhikr.transliteration}</div>
                    <div class="dhikr-card-meaning">${dhikr.meaning}</div>
                </div>
            `).join('');
        }

        function filterDhikr(category) {
            document.querySelectorAll('.dhikr-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.toLowerCase() === category || 
                    (category === 'all' && tab.textContent === 'All'));
            });
            renderDhikrCards(category);
        }

        function selectDhikr(id) {
            currentDhikr = dhikrList.find(d => d.id === id);
            target = currentDhikr.defaultTarget;
            count = data.today[id] || 0;
            
            document.getElementById('currentArabic').textContent = currentDhikr.arabic;
            document.getElementById('currentMeaning').textContent = currentDhikr.meaning;
            
            document.getElementById('dhikrSelector').style.display = 'none';
            document.getElementById('counterSection').style.display = 'block';
            
            updateDisplay();
            updateTargetButtons();
        }

        function showDhikrSelector() {
            document.getElementById('dhikrSelector').style.display = 'block';
            document.getElementById('counterSection').style.display = 'none';
            renderDhikrCards();
        }

        function incrementCounter() {
            count++;
            data.today[currentDhikr.id] = count;
            data.total[currentDhikr.id] = (data.total[currentDhikr.id] || 0) + 1;
            saveData();
            
            updateDisplay();
            triggerFeedback();
            
            // Check if target reached
            if (count === target) {
                celebrate();
            }
        }

        function decrementCounter() {
            if (count > 0) {
                count--;
                data.today[currentDhikr.id] = count;
                data.total[currentDhikr.id] = Math.max(0, (data.total[currentDhikr.id] || 0) - 1);
                saveData();
                updateDisplay();
            }
        }

        function resetCounter() {
            count = 0;
            data.today[currentDhikr.id] = 0;
            saveData();
            updateDisplay();
        }

        function setTarget(newTarget) {
            target = newTarget;
            updateDisplay();
            updateTargetButtons();
        }

        function updateTargetButtons() {
            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.textContent) === target);
            });
        }

        function updateDisplay() {
            document.getElementById('counterNumber').textContent = count;
            document.getElementById('todayCount').textContent = count;
            document.getElementById('totalCount').textContent = data.total[currentDhikr.id] || 0;
            
            const progress = Math.min(100, Math.round((count / target) * 100));
            document.getElementById('targetProgress').textContent = progress + '%';
            
            // Update progress circle
            const circumference = 2 * Math.PI * 108;
            const offset = circumference - (progress / 100) * circumference;
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
        }

        function triggerFeedback() {
            // Vibration
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
            
            // Visual feedback
            const indicator = document.getElementById('vibrateIndicator');
            indicator.classList.remove('pulse');
            void indicator.offsetWidth; // Trigger reflow
            indicator.classList.add('pulse');
            
            // Sound (optional)
            if (soundEnabled) {
                // Could add click sound here
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        }

        function celebrate() {
            document.getElementById('celebrationTarget').textContent = target;
            document.getElementById('celebration').classList.add('show');
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 100]);
            }
        }

        function closeCelebration() {
            document.getElementById('celebration').classList.remove('show');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderDhikrCards();
        });
    </script>
</body>
</html>
