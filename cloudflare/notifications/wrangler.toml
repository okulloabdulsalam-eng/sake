name = "kiuma-notifications"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for storing FCM device tokens
[[kv_namespaces]]
binding = "FCM_TOKENS"
id = "c98a9c48a6b447d387ace694caf46004"

# Secrets (set via wrangler secret put):
#   npx wrangler secret put FCM_CLIENT_EMAIL
#   npx wrangler secret put FCM_PRIVATE_KEY
#   npx wrangler secret put ADMIN_KEY

[vars]
FCM_PROJECT_ID = "kiuma-mob-app"
