name = "kiuma-pesapal"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV for fundraising total. Create namespace: npx wrangler kv:namespace create "FUNDRAISING_KV"
# Then replace the id below with the returned id (and add a preview id for local dev if needed).
[[kv_namespaces]]
binding = "FUNDRAISING_KV"
id = "7cfc757498734b6d8c0de93706bb134a"

# Secrets (set via wrangler secret put):
#   npx wrangler secret put PESAPAL_CONSUMER_KEY
#   npx wrangler secret put PESAPAL_CONSUMER_SECRET
#   npx wrangler secret put PESAPAL_NOTIFICATION_ID
#
# Environment variables (non-secret):
[vars]
PESAPAL_TEST_MODE = "false"
APP_BASE_URL = "https://okulloabdulsalam-eng.github.io/sake"
WORKER_URL = "https://kiuma-pesapal.kiuma4.workers.dev"
# ↑ Set WORKER_URL after first deploy (e.g. https://kiuma-pesapal.YOUR_SUBDOMAIN.workers.dev)
